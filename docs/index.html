<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dokumentacja QGPU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="logo">Dokumentacja QGPU</div>
    </header>

    <div class="layout">
        <main class="content">
            <h1>Dokumentacja QGPU</h1>
            <p>...</p>
            <h2>1. ...</h2>
            <table class="cmd-table">
                <thead>
                    <tr>
                        <th>...</th>
                        <th>...</th>
                        <th>...</th>
                        <th>...</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="void">
                        <td data-tooltip="..."><code>...</code></td>
                        <td data-tooltip="...">...</td>
                        <td><code>...</code></td>
                        <td>...</td>
                    </tr>
                </tbody>
            </table>

            <h2>2. Podstawowe definicje</h2>
            <table class="cmd-table">
                <thead>
                    <tr>
                        <th>Nazwa</th>
                        <th>Domyślna wartość</th>
                        <th>Opis</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="def">
                        <td data-tooltip="char*"><code>...</code></td>
                        <td data-tooltip="..."><code>...</code></td>
                        <td>...</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
</body>
</html>
